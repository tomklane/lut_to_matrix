name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Linux packages for the Tauri app (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      - name: Front end (type check + build; the app embeds it)
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build
      - run: cargo test --workspace --locked
        env:
          # The OpenDRT parity test compiles the DCTL; Windows runners have no `c++`
          # and rely on the committed fixture instead.
          LUTMATRIX_REQUIRE_CXX: ${{ matrix.os != 'windows-latest' && '1' || '' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
