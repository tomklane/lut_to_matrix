name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
        env:
          # The OpenDRT parity test compiles the DCTL; Windows runners have no `c++`
          # and rely on the committed fixture instead.
          LUTMATRIX_REQUIRE_CXX: ${{ matrix.os != 'windows-latest' && '1' || '' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
