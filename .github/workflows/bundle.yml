name: Bundle

# Unsigned app bundles for testing: macOS universal .app/.dmg and Windows NSIS/MSI
# installers, uploaded as workflow artifacts. Runs on demand and for version tags.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  bundle:
    name: bundle (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: windows
            os: windows-latest
            args: ""
            targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install front-end packages
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Build bundles
        working-directory: app
        run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        if: matrix.name == 'macos'
        with:
          name: LUT-Matrix-macOS
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.name == 'windows'
        with:
          name: LUT-Matrix-Windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
