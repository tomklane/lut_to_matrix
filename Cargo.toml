[workspace]
resolver = "2"
members = ["crates/lutmatrix-core", "crates/lutmatrix-cli"]

# The single source of truth for the app version. Every crate (and the Tauri
# app, from stage 4) inherits it; it is stamped into every exported DCTL.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["tomklane"]
license = "UNLICENSED"
repository = "https://github.com/tomklane/lut_to_matrix"

[workspace.dependencies]
lutmatrix-core = { path = "crates/lutmatrix-core" }
nalgebra = { version = "0.33", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
regex = "1"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"

# The synthetic fitting tests build several 65³ LUTs; optimise test builds.
[profile.test]
opt-level = 2
