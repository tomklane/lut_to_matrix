[workspace]
resolver = "2"
members = ["crates/lutmatrix-core", "crates/lutmatrix-opendrt", "crates/lutmatrix-cli", "app/src-tauri"]

# The single source of truth for the app version. Every crate (and the Tauri
# app, from stage 4) inherits it; it is stamped into every exported DCTL.
[workspace.package]
version = "0.7.0"
edition = "2021"
rust-version = "1.88"
authors = ["tomklane"]
license = "GPL-3.0-or-later"
repository = "https://github.com/tomklane/lut_to_matrix"

[workspace.dependencies]
lutmatrix-core = { path = "crates/lutmatrix-core" }
lutmatrix-opendrt = { path = "crates/lutmatrix-opendrt" }
nalgebra = { version = "0.33", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
regex = "1"
# Chart stills (TIFF, OpenEXR, PNG, JPEG); exr directly for its header attributes.
image = { version = "0.25", default-features = false, features = ["tiff", "exr", "png", "jpeg"] }
exr = { version = "1.73", default-features = false }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"

# The synthetic fitting tests build several 65³ LUTs; optimise test builds.
[profile.test]
opt-level = 2
